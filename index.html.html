апишете ги приходите и фиксните трошоци. Она што останува е вашата реална основа за една рата."},{title:"Споредувајте по вкупен износ",text:"Две понуди со иста рата можат да имаат различен вкупен износ за враќање, зависно од рокот на отплата."},{title:"Оставете простор за непредвидено",text:"Ратата не треба да го исцрпи целиот слободен буџет. Резервата ве штити ако нешто се промени."}],checklistTitle:"Список за проверка пред да одлучите",checklist:["Знам колку пари навистина ми требаат и за што.","Ја споредив месечната рата со мојот месечен приход.","Го видов вкупниот износ што ќе го вратам.","Ги прочитав условите и потребната документација.","Знам што се случува ако задоцнам со рата."],estimator:void 0,calc:{amount:6e4,months:24},faqs:[{q:"За што може да се користи кредит за лични потреби?",a:"Општо, за потреби што не се врзани за една конкретна намена. Точните услови и евентуални ограничувања ги определуваат условите на производот. [да се потврди со MoneyMax]"},{q:"Како да знам која рата ми одговара?",a:"Соберете ги месечните приходи и сите постојни обврски. Ратата треба да остави простор за секојдневни трошоци и резерва. Користете го калкулаторот и ориентациската проверка на оваа страница."},{q:"Дали резултатот од калкулаторот е конечен?",a:"Не. Калкулаторот дава ориентација. Конечната рата и вкупниот износ ги потврдуваат условите на MoneyMax при аплицирањето."}],related:["kredit-do-plata","tekovni-trosoci","refinansiranje"],articles:["kako-da-ja-presmetate-ratata","na-shto-da-vnimavate-pred-kredit"],seasons:["jan-mar"]},{slug:"renoviranje",category:"dom-i-semejstvo",kind:"usecase",depth:"full",navTitle:"Кредит за реновирање",h1:"Планирате реновирање на домот?",metaTitle:"Кредит за реновирање: буџет, список и пресметка на рата | MoneyMax",metaDescription:"Планирајте го реновирањето: проценка на буџетот, список за проверка и пресметка на месечна рата. Запознајте се со можностите на MoneyMax.",primaryKeyword:"кредит за реновирање",secondaryKeywords:["буџет за реновирање"],seoNote:"Главна страница за „кредит за реновирање“. „Кредит за поправка на дом“ е доделен на /krediti/popravki-vo-domot/; ако двете страници се натпреваруваат, консолидирајте ја таа овде.",icon:"paintbrush",cardBlurb:"Од освежување на една просторија до поголеми промени, започнете со јасен буџет.",intro:"Од освежување на една просторија до поголеми промени во вашиот дом, доброто планирање започнува со јасна претстава за трошоците. Истражете како да го организирате буџетот и запознајте се со финансиските можности што ви стојат на располагање.",howItHelps:"Ако реновирањето го надминува она што сте го заштедиле, можете да разгледате дали општиот кредит на MoneyMax одговара на вашата ситуација. Ова не е посебен „кредит за реновирање“ [да се потврди дали ваков производ постои]. Затоа најпрво одредете го вкупниот буџет, па дури потоа износот што би го позајмиле.",expenseExamples:["Материјали (плочки, фарби, подови)","Мајстори и работа","Електрика и водовод","Столарија и врати","Мебел и опрема","Резерва за непредвидено"],tips:[{title:"Побарајте повеќе понуди",text:"Понудите од најмалку двајца мајстори, со јасна спецификација на работата, ви даваат основа за споредба и преговори."},{title:"Работете по фази",text:"Поделбата на реновирањето на фази ви дава контрола врз трошоците и можност да застанете ако буџетот се промени."},{title:"Предвидете резерва",text:"Во постари објекти често се откриваат проблеми што не се гледаат однапред. Резерва од десетина проценти од буџетот е честа практика."}],checklistTitle:"Список за буџет на реновирање",checklist:["Список на простории и работи, подредени по приоритет.","Понуди од најмалку двајца мајстори.","Проценка на материјали со количини.","Резерва за непредвидени трошоци.","Договор во писмена форма со рок на изведба.","План за плаќање по фази на работа."],estimator:{type:"items",title:"Проценка на буџетот за реновирање",note:"Износите се примерни. Заменете ги со вашите понуди и проценки.",totalLabel:"Проценет вкупен буџет",reservePct:15,items:[{id:"mat",label:"Материјали",hint:"плочки, фарби, подни облоги",amount:4e4},{id:"work",label:"Мајстори и работа",hint:"молерисување, поплочување, зидање",amount:35e3},{id:"elec",label:"Електрика и водовод",amount:15e3},{id:"wood",label:"Столарија и врати",amount:2e4},{id:"furn",label:"Мебел и опрема",amount:25e3},{id:"misc",label:"Транспорт и отпад",amount:5e3}]},calc:{amount:1e5,months:36},faqs:[{q:"Колку да предвидам за непредвидени трошоци?",a:"Нема единствено правило, но често се препорачува резерва од околу 10 до 15 проценти од буџетот, особено кај постари објекти. Во проценката погоре можете сами да го прилагодите процентот."},{q:"Дали е подобро да реновирам по фази или одеднаш?",a:"Фазите ја намалуваат потребата од еднократен голем износ и ви даваат време да прилагодите. Одеднаш е побрзо, но бара поголем однапред одреден буџет. Изборот зависи од вашата ситуација."},{q:"Што ако трошоците го надминат планираното?",a:"Прво прегледајте што може да почека до следната фаза. Ако сепак ви треба дополнителен износ, повторно пресметајте ја ратата и вкупниот износ за враќање пред да одлучите."}],related:["popravki-vo-domot","opremuvanje-dom","itni-domashni-trosoci"],articles:["budzet-za-renoviranje","kako-da-ja-presmetate-ratata"],seasons:["jan-mar","jul-sep"]},{slug:"patuvanje",category:"patuvanja-i-odmor",kind:"usecase",depth:"full",navTitle:"Кредит за патување",h1:"Подготвувате патување?",metaTitle:"Кредит за патување: буџет за одмор и пресметка на рата | MoneyMax",metaDescription:"Како да го испланирате буџетот за патување: превоз, сместување и непредвидени трошоци. Пресметајте рата и запознајте ги можностите на MoneyMax.",primaryKeyword:"кредит за патување",secondaryKeywords:["кредит за одмор","буџет за патување"],seoNote:"„Кредит за одмор“ е опфатен овде за да не се создаде конкурентна страница. /krediti/letuvanje/ и /krediti/zimuvanje/ се сезонски потстраници со посебна содржина.",icon:"plane",cardBlurb:"Планирајте го патувањето однапред: превоз, сместување, храна и резерва.",intro:"Добриот одмор започнува со добар план. Кога однапред знаете колку ќе чини патувањето, од превоз и сместување до храна и мали непредвидени трошоци, полесно одлучувате колку можете да издвоите и дали воопшто има потреба од позајмување.",howItHelps:"За патување најпрво проверете дали може да се покрие со штедење или со порано резервирање. Ако ви треба помош за распределба на трошокот, општиот кредит на MoneyMax може да биде една од опциите. [Не постои потврден посебен производ за патување.] Важно е ратата да ви одговара и по враќањето од одмор.",expenseExamples:["Превоз (авион, автобус, гориво)","Сместување","Храна и локален превоз","Активности и влезници","Патничко осигурување","Резерва за непредвидено"],tips:[{title:"Резервирајте порано",text:"Раните резервации често носат подобри услови, но проверете ги условите за откажување пред да платите."},{title:"Пресметајте и трошоци на самото место",text:"Храна, превоз и мали купувања лесно се превидуваат. Дневен буџет по лице ви дава поточна слика."},{title:"Одморот не треба да стане оптоварување",text:"Размислете дали ратата ќе ви одговара и по враќањето, кога ќе се вратите на редовните обврски."}],checklistTitle:"Список за буџет на патување",checklist:["Дестинација и датуми на патување.","Превоз и сместување, со услови за откажување.","Дневен буџет за храна и активности.","Патничко осигурување и потребни документи.","Резерва за непредвидени трошоци.","Месечна рата што не го оптоварува буџетот по враќањето."],estimator:{type:"items",title:"Проценка на буџетот за патување",note:"Износите се примерни. Заменете ги со реални цени за вашата дестинација.",totalLabel:"Проценет трошок за патувањето",reservePct:10,items:[{id:"trans",label:"Превоз",hint:"авион, автобус или гориво",amount:2e4},{id:"stay",label:"Сместување",amount:3e4},{id:"food",label:"Храна и пијалаци",amount:12e3},{id:"act",label:"Активности и влезници",amount:6e3},{id:"ins",label:"Патничко осигурување",amount:2e3},{id:"local",label:"Локален превоз и мали купувања",amount:5e3}]},calc:{amount:7e4,months:12},faqs:[{q:"Дали е добра идеја да се позајмува за одмор?",a:"Зависи од вашата ситуација. Одморот е трошок што не создава приход, па е важно ратата да ви остави простор по враќањето. Прво разгледајте штедење и подолга рамка за планирање."},{q:"Колку однапред да започнам со планирање?",a:"Колку порано, толку подобро. Така можете да ги споредите цените, да резервирате по подобри услови и да поставите штедење пред да ви затреба позајмување."},{q:"Што ако патувањето се откаже?",a:"Проверете ги условите за откажување и осигурувањето пред да платите. Ратата, доколку сте позајмиле, се отплаќа независно од тоа дали патувањето се реализира."}],related:["letuvanje","zimuvanje","ekskurzija"],articles:["kolku-chini-letniot-odmor","kako-da-planirate-neplanirani-trosoci"],seasons:["apr-jun","okt-dek"]},{slug:"neplanirani-trosoci",category:"licni-finansii",kind:"usecase",depth:"full",navTitle:"Кредит за непланирани трошоци",h1:"Се соочувате со непланиран трошок?",metaTitle:"Кредит за непланирани трошоци: опции и пресметка | MoneyMax",metaDescription:"Непланиран трошок? Проценете ја итноста, видете ги опциите пред позајмување и пресметајте рата. Јасни информации од MoneyMax.",primaryKeyword:"кредит за непланирани трошоци",seoNote:"Главна страница за „кредит за непланирани трошоци“. „Кредит за итни трошоци“ е доделен на /krediti/itni-domashni-trosoci/; следете го преклопувањето и консолидирајте ако е потребно.",icon:"shield",cardBlurb:"Кога трошокот доаѓа неочекувано, прво проценете, па дури потоа одлучете.",intro:"Неочекуваните трошоци ретко доаѓаат во вистинско време. Без разлика дали е расипан уред, итна поправка или сметка што не сте ја предвиделе, првиот чекор е да се смирите и да ја процените ситуацијата: колку чини, колку е итно и кои опции ги имате.",howItHelps:"Ако по заштедите и другите опции сè уште недостасува износ, можете да ја пресметате ратата на општиот кредит на MoneyMax и да ги прочитате условите без притисок. [Не е потврден посебен производ за непланирани трошоци.] Не носете одлука во паника: споредете ги опциите.",expenseExamples:["Расипан апарат или уред","Итна поправка","Здравствен трошок","Патни и транспортни трошоци","Непредвидена сметка"],tips:[{title:"Прво проценете ја итноста",text:"Прашајте се што мора да се реши денес, а што може да почека неколку дена додека ги споредите опциите."},{title:"Прашајте за плаќање на делови",text:"Многу даватели на услуги, од сервиси до здравствени установи, нудат поделба на плаќањето. Прашајте пред да одлучите за позајмување."},{title:"Позајмете само за јазот",text:"Ако имате дел од износот, позајмувањето само на разликата ја намалува ратата и вкупниот износ за враќање."}],checklistTitle:"Што да проверите пред да одлучите",checklist:["Колку точно чини и колку е итно.","Што можам да покријам од заштеди.","Дали давателот на услугата нуди плаќање на делови.","Колкава рата можам да издржам секој месец.","Вкупниот износ за враќање, пред да се одлучам."],estimator:{type:"gap",title:"Колкав е јазот што треба да го покриете?",note:"Внесете го трошокот и она што веќе можете да го покриете. Остатокот можете да го пренесете во калкулаторот."},calc:{amount:3e4,months:12},faqs:[{q:"Колку брзо ќе добијам одговор по аплицирањето?",a:"Не можеме да ветиме рок на одобрување додека процесот не се потврди со MoneyMax. [да се потврди]"},{q:"Што ако ми треба помал износ?",a:"Позајмувањето само на потребниот износ е добра практика. Користете го калкулаторот за да видите како износот и рокот влијаат на ратата."},{q:"Како да се подготвам за следниот пат?",a:"Резервен фонд, макар и мал, ви дава простор. Повеќе совети ќе најдете во водичот за планирање на непланирани трошоци."}],related:["itni-domashni-trosoci","medicinski-trosoci","popravka-na-avtomobil"],articles:["kako-da-planirate-neplanirani-trosoci","na-shto-da-vnimavate-pred-kredit"],seasons:["okt-dek","jul-sep"]}],Ie=s=>({depth:"template",checklistTitle:"Список за проверка",calc:{amount:5e4,months:24},...s}),sg=[Ie({slug:"kredit-do-plata",category:"licni-finansii",kind:"usecase",navTitle:"Кредит до плата",h1:"Ви треба поддршка до следната плата?",metaTitle:"Кредит до плата: што да знаете пред да одлучите | MoneyMax",metaDescription:"Ги надминувате месечните трошоци пред платата? Информирајте се за опциите, ризиците и како да процените дали краткорочно позајмување има смисла.",primaryKeyword:"кредит до плата",seoNote:"Силна преклопена намера со „кредит за лични потреби“. Задржете ја како посебна страница само ако MoneyMax има краткорочен производ; во спротивно консолидирајте.",icon:"calendar",cardBlurb:"Кога месецот е подолг од платата, добро е да ги знаете опциите и ризиците.",intro:"Понекогаш месецот е подолг од платата. Една непредвидена сметка или поскапа набавка и средствата не стигнуваат до денот на исплатата. Ако ова ви се повторува, важно е да погледнете подлабоко, не само да ја премостите празнината.",howItHelps:"Краткорочното позајмување може да премости еднократна празнина, но не го решава редовниот недостиг. [Не е потврдено дали MoneyMax нуди посебен производ „до плата“. Информациите овде се општи.] Пред да позајмите, проверете го вкупниот износ за враќање и дали ратата повторно ќе го оптовари следниот месец.",expenseExamples:["Сметки пред исплата","Непредвидена набавка","Превоз и гориво","Школски или семејни трошоци"],tips:[{title:"Разликувајте еднократно од повторливо",text:"Ако празнината се повторува секој месец, проблемот е во структурата на буџетот, а не во еден расход."},{title:"Пресметајте го следниот месец",text:"Ратата ќе се појави во идната плата. Проверете дали ќе остане доволно за тековните трошоци."},{title:"Прашајте за одложено плаќање",text:"Давателите на комунални и други услуги понекогаш одобруваат одложување без дополнителен кредит."}],checklist:["Дали празнината е еднократна или се повторува?","Колку точно ми недостасува до платата?","Што можам да одложам или да поделам?","Колкава е вкупната сума за враќање?","Ќе ми остане ли доволно по следната плата?"],calc:{amount:2e4,months:6},faqs:[{q:"Дали краткорочното позајмување е добро решение?",a:"За еднократна и јасна празнина може да помогне, но не е решение за редовен недостиг на средства. Прво проценете што предизвикува празнината."},{q:"Што ако не можам да ја вратам ратата на време?",a:"Контактирајте го давателот на кредитот пред да задоцните. Последиците од доцнење зависат од условите на договорот. [да се потврди со MoneyMax]"}],related:["licni-potrebi","tekovni-trosoci","plakanje-smetki"],articles:["na-shto-da-vnimavate-pred-kredit","kako-da-planirate-neplanirani-trosoci"]}),Ie({slug:"kredit-za-penzioneri",category:"licni-finansii",kind:"usecase",navTitle:"Кредит за пензионери",h1:"Планирате како пензионер?",metaTitle:"Кредит за пензионери: информации и совети за планирање | MoneyMax",metaDescription:"Информации за пензионери: како да процените реална месечна рата при фиксен приход и на што да внимавате. Совети од MoneyMax.",primaryKeyword:"кредит за пензионери",seoNote:"Не користете ја оваа страница како понуда додека не се потврди дека постои производ и старосни/приходни услови за пензионери.",icon:"sunrise",cardBlurb:"При фиксен приход, јасната рата и резервата се особено важни.",intro:"Пензијата е стабилен, но фиксен приход. Затоа секоја нова обврска бара посебно внимание: колку остава за лекови, сметки и секојдневие по плаќањето на ратата. Овде се собрани прашања што вреди да си ги поставите пред да одлучите.",howItHelps:"Ако размислувате за позајмување, најважно е ратата да остане мала во однос на пензијата. [Не е потврдено дали MoneyMax нуди посебен производ за пензионери, ниту какви услови важат за возраст и приход. Информациите овде се општи.]",expenseExamples:["Здравствени и лековни трошоци","Поправки во домот","Помош за деца и внуци","Зимски и комунални трошоци"],tips:[{title:"Ратата нека биде мала",text:"При фиксен приход, подолг рок со помала рата може да биде попријатен, но вкупниот износ за враќање расте. Споредете и двете."},{title:"Вклучете ги сите редовни трошоци",text:"Лекови, сметки за греење и комунални услуги, па дури потоа пресметајте колку остава."},{title:"Разговарајте со блиски",text:"Разговорот со некој од семејството или доверлива личност помага да се согледаат опциите."}],checklist:["Колкав е мојот месечен приход од пензија?","Кои се моите постојни обврски?","Колку ми остава по ратата?","Дали знам што точно потпишувам?","Разговарав ли со некој близок?"],calc:{amount:3e4,months:24},faqs:[{q:"Дали пензионерите можат да аплицираат за кредит?",a:"Условите за возраст, приход и документација ги определува давателот. [да се потврди со MoneyMax]"},{q:"На што посебно да внимавам?",a:"На вкупниот износ за враќање, на рокот и на тоа дали ратата ќе ви остави простор за здравствени и други неопходни трошоци."}],related:["licni-potrebi","medicinski-trosoci","popravki-vo-domot"],articles:["na-shto-da-vnimavate-pred-kredit","kako-da-ja-presmetate-ratata"]}),Ie({slug:"popravki-vo-domot",category:"dom-i-semejstvo",kind:"usecase",navTitle:"Кредит за поправки во домот",h1:"Домот бара поправка?",metaTitle:"Кредит за поправка на дом: планирање на трошоците | MoneyMax",metaDescription:"Протекување, стара инсталација или оштетена столарија? Проценете ги трошоците за поправка на домот и видете што да проверите пред позајмување.",primaryKeyword:"кредит за поправка на дом",seoNote:"Близок со /krediti/renoviranje/. Разликата: поправки (кои се решаваат проблеми) наспроти реновирање (подобрување). Ако се појави канибализација, консолидирајте.",icon:"wrench",cardBlurb:"Кога нешто во домот мора да се поправи, редоследот на приоритети прави разлика.",intro:"Поправката на домот ретко чека. Протекување на кровот, дотрајана инсталација или оштетена столарија се работи што мора да се решат за да не станат поскапи. Но дури и тогаш вреди да се запрете за момент и да ги подредите приоритетите.",howItHelps:"Најпрво одвоете го итното од тоа што може да почека. За она што не се одложува, проверете дали средствата се доволни, а ако не, пресметајте ја ратата на општ кредит. [Не е потврден посебен кредит за поправки.]",expenseExamples:["Покрив и изолација","Водоводни и електрични инсталации","Прозорци и врати","Фасада и влага"],tips:[{title:"Најпрво безбедноста",text:"Проблеми со електрика, гас и влага имаат предност пред естетските поправки."},{title:"Побарајте писмена понуда",text:"Понуда со опис на работата и материјалите ги спречува изненадувањата на крајот."},{title:"Одложувањето може да чини повеќе",text:"Малата штета често станува голема. Проценете што ќе го чини одложувањето."}],checklist:["Што е итно, а што може да почека?","Понуда од мајстор со опис на работа.","Гаранција за изведената работа.","Резерва за непредвидена штета.","Рата што ми одговара."],calc:{amount:5e4,months:18},faqs:[{q:"Која е разликата меѓу поправка и реновирање?",a:"Поправката решава проблем кој постои, а реновирањето го подобрува или менува просторот. Двете имаат различен приоритет и различна итност."},{q:"Колку да чекам со поправка?",a:"Кај безбедносни проблеми не чекајте. За останатото, споредете ги понудите и подредете по приоритет."}],related:["renoviranje","itni-domashni-trosoci","opremuvanje-dom"],articles:["budzet-za-renoviranje","kako-da-planirate-neplanirani-trosoci"],seasons:["apr-jun","okt-dek"]}),Ie({slug:"opremuvanje-dom",category:"dom-i-semejstvo",kind:"usecase",navTitle:"Кредит за опремување на домот",h1:"Го опремувате домот?",metaTitle:"Кредит за мебел и опремување на дом: планирање | MoneyMax",metaDescription:"Нов стан или замена на мебел? Планирајте го опремувањето по простории и проценете месечна рата за мебел и апарати.",primaryKeyword:"кредит за мебел",icon:"sofa",cardBlurb:"Опремувањето оди по простории, а и по приоритет.",intro:"Опремувањето на дом е процес, а не еднократна набавка. Најдобро е да почнете од она што ви е најпотребно и да ги додавате деновите што доаѓаат. Така ја контролирате потрошувачката и добивате простор што навистина ви одговара.",howItHelps:"Ако сакате да ги распоредите трошоците, пресметајте ја ратата на општ кредит и споредете ја со штедење или набавка по етапи. [Не е потврден посебен кредит за мебел.] Прашајте и дали продавачот нуди плаќање на рати.",expenseExamples:["Кујна и апарати","Спална соба","Дневна соба","Осветлување и текстил"],tips:[{title:"Почнете од основното",text:"Кревет, кујна и основни апарати, а останатото во следните етапи."},{title:"Измерете двапати",text:"Точните мерки спречуваат скапи грешки при нарачка по мерка."},{title:"Споредете вкупна цена",text:"Вклучете транспорт, монтажа и гаранција во споредбата."}],checklist:["Список на простории по приоритет.","Точни мерки.","Споредба на понуди со монтажа.","Гаранциски рок.","Рата во однос на месечниот буџет."],estimator:{type:"items",title:"Проценка на опремувањето",note:"Примерни износи, заменете ги со вашите.",totalLabel:"Проценет трошок за опремување",reservePct:10,items:[{id:"k",label:"Кујна",amount:6e4},{id:"a",label:"Апарати",amount:4e4},{id:"b",label:"Спална соба",amount:35e3},{id:"d",label:"Дневна соба",amount:3e4}]},calc:{amount:8e4,months:24},faqs:[{q:"Дали да купам сè одеднаш?",a:"Не мора. Опремување по етапи ви дава време, ја намалува потребата од еднократен износ и ви овозможува да прилагодите според искуството."},{q:"Како да ја споредам понудата за мебел?",a:"Споредувајте ја вкупната цена со транспорт, монтажа и гаранција, не само цената на ставките."}],related:["renoviranje","preseluvanje","kredit-za-svadba"],articles:["budzet-za-renoviranje","kako-da-ja-presmetate-ratata"],seasons:["jul-sep"]}),Ie({slug:"kredit-za-svadba",category:"dom-i-semejstvo",kind:"usecase",navTitle:"Кредит за свадба",h1:"Подготвувате свадба?",metaTitle:"Кредит за свадба: буџет за свадба и пресметка на рата | MoneyMax",metaDescription:"Свадбата е голем ден, а и голем трошок. Испланирајте го буџетот по ставки и проценете реална месечна рата. Совети од MoneyMax.",primaryKeyword:"кредит за свадба",icon:"rings",cardBlurb:"Убав ден без финансиски притисок започнува со реален буџет.",intro:"Свадбата е еден од најубавите денови, а често и еден од најскапите. Најголемиот ризик е пресметката да се остави настрана додека се одлучуваат деталите. Едноставен буџет по ставки ви помага да знаете што е приоритет, а што може да се прилагоди.",howItHelps:"Ако дел од трошокот го покривате со позајмување, пресметајте ја ратата унапред и проверете дали ќе ви одговара и по свадбата, во новиот заеднички живот. [Не е потврден посебен кредит за свадба.] Подароците од гостите не се гаранција и не треба да се сметаат како извор на отплата.",expenseExamples:["Салон и кетеринг","Музика и фотографија","Облека и аранжмани","Покани и украс"],tips:[{title:"Одредете број на гости",text:"Бројот на гости најмногу влијае на вкупниот трошок. Започнете оттаму."},{title:"Не сметајте на подароците",text:"Подароците се непредвидливи. Планирајте го буџетот без нив."},{title:"Договорете по ставки",text:"Писмен договор со секој давател на услуга ги прави јасни очекувањата и цените."}],checklist:["Број на гости.","Салон и кетеринг, во писмена понуда.","Резерва за непредвидено.","Календар на уплати на аконтации.","Рата што ќе ни одговара и по свадбата."],estimator:{type:"items",title:"Проценка на буџетот за свадба",note:"Износите се примерни, а најмногу зависат од бројот на гости.",totalLabel:"Проценет трошок за свадба",reservePct:10,items:[{id:"h",label:"Салон и кетеринг",amount:15e4},{id:"m",label:"Музика",amount:25e3},{id:"p",label:"Фотографија и видео",amount:3e4},{id:"c",label:"Облека и аранжмани",amount:4e4},{id:"i",label:"Покани и украс",amount:1e4}]},calc:{amount:15e4,months:36},faqs:[{q:"Дали е добро свадбата да се плаќа со позајмени средства?",a:"Тоа е лична одлука. Важно е ратата да ви одговара и по свадбата и да не сметате на подароците како извор на отплата."},{q:"Како да го намалам трошокот?",a:"Најчесто со помал број на гости, термин надвор од најпрометниот период и приоритети кои се јасно договорени."}],related:["preseluvanje","opremuvanje-dom","licni-potrebi"],articles:["kako-da-ja-presmetate-ratata","na-shto-da-vnimavate-pred-kredit"],seasons:["apr-jun","jul-sep"]}),Ie({slug:"preseluvanje",category:"dom-i-semejstvo",kind:"guide",navTitle:"Финансиска поддршка за преселување",h1:"Се селите на нова адреса?",metaTitle:"Трошоци за преселување: што да предвидите | MoneyMax",metaDescription:"Преселбата носи повеќе трошоци отколку што се чини. Погледнете што да предвидите и како да го организирате буџетот.",primaryKeyword:"трошоци за преселување",seoNote:"Информативна страница. Не таргетира комерцијален клучен збор.",icon:"boxes",cardBlurb:"Преселбата чини повеќе од превозот, па затоа е добро да ја испланирате.",intro:"Кога се селите, трошоците не завршуваат со камионот. Депозит, кирија однапред, пријавување на комунални услуги, мали поправки и опрема за новиот простор лесно ја надминуваат првичната проценка. Затоа вреди да ги наброите однапред.",howItHelps:"Оваа страница е водич за планирање. Ако после проценката ви недостасува износ, можете да ја пресметате ратата на општ кредит. [Не е потврден посебен производ за преселување.]",expenseExamples:["Превоз и селидба","Депозит и кирија однапред","Комунални услуги","Мали поправки и опрема"],tips:[{title:"Набројте ги скриените трошоци",text:"Депозит, чистење, пријавување и ново осветлување често се превидуваат."},{title:"Побарајте повеќе понуди за превоз",text:"Цената зависи од далечината, обемот и катот. Споредете најмалку три понуди."},{title:"Понесете помалку",text:"Преселбата е добра прилика да ги подредите работите и да не носите ненужно."}],checklist:["Депозит и прва кирија.","Понуда за превоз.","Датум на пријавување на комуналиите.","Список на потребни набавки.","Резерва за првиот месец."],estimator:{type:"items",title:"Проценка на трошоците за преселување",note:"Примерни износи.",totalLabel:"Проценет трошок за преселба",reservePct:10,items:[{id:"tr",label:"Превоз и селидба",amount:15e3},{id:"de",label:"Депозит и прва кирија",amount:4e4 о вкупна цена",text:"Вклучете туристичка такса, паркинг и храна."}],checklist:["Термин и дестинација.","Вкупна цена на сместување со такси.","Превоз во двете насоки.","Дневен буџет по лице.","Резерва и осигурување."],calc:{amount:6e4,months:12},faqs:[{q:"Колку однапред да резервирам?",a:"За популарни дестинации во јули и август, неколку месеци однапред. Така имате повеќе избор."},{q:"Како да го намалам трошокот?",a:"Со помалку популарен термин, сместување без услуга на храна или со поблиска дестинација."}],related:["patuvanje","zimuvanje","ekskurzija"],articles:["kolku-chini-letniot-odmor","kako-da-ja-presmetate-ratata"],seasons:["apr-jun"]}),Ie({slug:"zimuvanje",category:"patuvanja-i-odmor",kind:"usecase",navTitle:"Кредит за зимување",h1:"Планирате зимски одмор?",metaTitle:"Кредит за зимување: буџет за зимски одмор | MoneyMax",metaDescription:"Зимски одмор на планина? Планирајте сместување, ски-карти и опрема, па проценете реална месечна рата.",primaryKeyword:"кредит за зимување",icon:"snow",cardBlurb:"Ски-карти, опрема и сместување, подредени по приоритет.",intro:"Зимскиот одмор има свои посебни трошоци: ски-карти, опрема, превоз по планински патишта и сместување во сезона. Кога ќе ги наброите однапред, полесно е да одлучите колку денови можете да си дозволите.",howItHelps:"Планирајте го одморот околу вашиот буџет, а не обратно. Ако ви требаат средства за распределба, пресметајте рата на општ кредит. [Не е потврден посебен производ за зимување.]",expenseExamples:["Сместување","Ски-карти","Изнајмување опрема","Превоз и зимска опрема за автомобил"],tips:[{title:"Изнајмете наместо да купите",text:"Ако скијате ретко, изнајмувањето на опрема е често поповолно."},{title:"Проверете ја зимската опрема на возилото",text:"Гуми и ланци се дел од трошокот, а и од безбедноста."},{title:"Планирајте по денови",text:"Ски-картите најмногу влијаат на цената, па изберете го бројот на денови."}],checklist:["Број на денови и лица.","Цена на ски-карти и опрема.","Сместување во сезона.","Зимска опрема на возилото.","Резерва за времето."],calc:{amount:4e4,months:12},faqs:[{q:"Кога е најповолно зимување?",a:"Често надвор од празничниот период и викендите. Споредете ги цените по термини."},{q:"Дали да купам опрема?",a:"Ако не скијате често, изнајмувањето најчесто е поекономично."}],related:["patuvanje","praznici","letuvanje"],articles:["kolku-chini-letniot-odmor","kako-da-planirate-neplanirani-trosoci"],seasons:["okt-dek"]}),Ie({slug:"praznici",category:"patuvanja-i-odmor",kind:"guide",navTitle:"Планирање на празничните трошоци",h1:"Како да ги испланирате празничните трошоци?",metaTitle:"Празнични трошоци: како да планирате буџет за празници | MoneyMax",metaDescription:"Подароци, храна, патување и дружби. Погледнете како да го организирате празничниот буџет без да ви остане товар во јануари.",primaryKeyword:"празничен буџет",seoNote:"Водич (guide), не продуктна страница.",icon:"gift",cardBlurb:"Подароци, храна и патувања, без да остане товар во јануари.",intro:"Празниците носат радост, но и трошоци што се собираат: подароци, храна, патувања и дружби. Најголемата замка е да се потрошува без пресметка, па да се почувствува товарот во јануари. Едноставен план го менува тоа.",howItHelps:"Ова е водич за планирање. Празничните трошоци се предвидливи, па најдобро е да се покријат со штедење однапред. Позајмувањето за подароци обично не е најдобар избор. [Без посебен производ.]",expenseExamples:["Подароци","Празнична трпеза","Патување кај блиски","Украс и дружби"],tips:[{title:"Поставете тавана однапред",text:"Одредете вкупен износ и поделете го по ставки пред да започне сезоната."},{title:"Штедете од есен",text:"Мал месечен износ од октомври го намалува притисокот во декември."},{title:"Договорете се за подароци",text:"Заеднички подароци и симболични размени го намалуваат трошокот без да ја загубат радоста."}],checklist:["Вкупен таван на трошок.","Список на подароци и износи.","Трошоци за храна и дружби.","Резерва за патување.","План за јануари."],estimator:{type:"items",title:"Празничен буџет",note:"Примерни износи.",totalLabel:"Празничен буџет",reservePct:10,items:[{id:"g",label:"Подароци",amount:12e3},{id:"f",label:"Храна и пијалаци",amount:1e4},{id:"t",label:"Патување кај блиски",amount:6e3},{id:"d",label:"Украс и дружби",amount:4e3}]},calc:{amount:3e4,months:6},faqs:[{q:"Колку да издвојам за празниците?",a:"Нема универзална сума. Одредете износ што можете да го покриете без да ги засегнете редовните обврски."},{q:"Дали да се позајмува за подароци?",a:"Подароците се предвидлив трошок, па најдобро е да се покријат со штедење однапред."}],related:["zimuvanje","tekovni-trosoci","plakanje-smetki"],articles:["kako-da-planirate-neplanirani-trosoci","kako-da-ja-presmetate-ratata"],seasons:["okt-dek"]}),Ie({slug:"ekskurzija",category:"patuvanja-i-odmor",kind:"usecase",navTitle:"Финансиска поддршка за екскурзија",h1:"Екскурзија за вашето дете или клас?",metaTitle:"Екскурзија: како да го испланирате трошокот | MoneyMax",metaDescription:"Школска екскурзија бара план. Погледнете што влегува во цената, како да поделите во рати и што да прашате организаторот.",primaryKeyword:"трошоци за екскурзија",icon:"bus",cardBlurb:"Колку чини, што е вклучено и како да се плати на рати.",intro:"Екскурзијата е значајно искуство за децата, но за родителите е и трошок што доаѓа често со рок. Најважно е однапред да знаете што е вклучено во цената, што не е и колку дополнителни пари ќе му требаат на детето.",howItHelps:"Најпрво прашајте го организаторот за плаќање на рати, бидејќи тоа често е достапно. Ако ви треба поголема распределба, пресметајте рата на општ кредит. [Не е потврден посебен производ за екскурзија.]",expenseExamples:["Аранжман","Џепарлак","Осигурување","Дополнителни излети"],tips:[{title:"Прашајте што е вклучено",text:"Превоз, сместување, оброци и влезници. Опфатот не мора да е ист кај сите организатори."},{title:"Договорете џепарлак однапред",text:"Јасен износ го намалува притисокот врз детето и неизвесноста за вас."},{title:"Побарајте рати од организаторот",text:"Поделбата на плаќањето е често достапна без дополнителни трошоци. Проверете."}],checklist:["Што е вклучено во цената?","Рокови за уплата.","Можност за плаќање на рати.","Џепарлак и осигурување.","Услови при откажување."],calc:{amount:15e3,months:6},faqs:[{q:"Дали екскурзијата може да се плати на рати?",a:"Многу организатори нудат рати. Прашајте го училиштето или агенцијата пред да размислувате за позајмување."},{q:"Колку џепарлак да му дадам?",a:"Договорете дневен износ однапред според дестинацијата и она што е вклучено во цената."}],related:["patuvanje","letuvanje","obrazovanie"],articles:["kolku-chini-letniot-odmor","kako-da-planirate-neplanirani-trosoci"],seasons:["apr-jun"]}),Ie({slug:"medicinski-trosoci",category:"neocekuvani-trosoci",kind:"usecase",navTitle:"Кредит за медицински трошоци",h1:"Се соочувате со медицински трошок?",metaTitle:"Кредит за медицински трошоци: што да знаете | MoneyMax",metaDescription:"Здравствен трошок што не сте го планирале? Погледнете ги опциите, прашањата што вреди да ги поставите и како да проценете реална рата.",primaryKeyword:"кредит за медицински трошоци",seoNote:"Чувствителна тема: без ветувања и без итност. Не користете медицински ризик како маркетинг.",icon:"heart",cardBlurb:"Здравјето е на прво место. Прашањата за пари можат да се подредат чекор по чекор.",intro:"Кога станува збор за здравје, последно што сакате е да размислувате за пари. Но токму затоа јасна слика за трошокот помага: што покрива осигурувањето, што мора да се плати и кои опции имате за остатокот.",howItHelps:"Најпрво проверете што е покриено од здравственото осигурување и дали установата нуди плаќање на делови. Ако остане јаз, пресметајте ја ратата на општ кредит. [Не е потврден посебен производ за медицински трошоци.]",expenseExamples:["Преглед и дијагностика","Операција или терапија","Лекови","Рехабилитација"],tips:[{title:"Прашајте за покриеното",text:"Проверете што покрива задолжителното и дополнителното осигурување мулатор"],tips:[{title:"Побарајте втора понуда",text:"Цените значително варираат. Втора понуда може да спести повеќе од очекуваното."},{title:"Прашајте за оригинални и компатибилни делови",text:"Разликата во цена може да е голема, а и во гаранција."},{title:"Проценете дали вреди",text:"Ако поправката е блиска до вредноста на возилото, размислете за алтернатива."}],checklist:["Писмена понуда со делови и работа.","Втора понуда.","Гаранција на работата.","Алтернативи за превоз.","Рата во однос на буџетот."],estimator:{type:"gap",title:"Колку недостасува за поправката?",note:"Внесете ја понудата и што можете да покриете од заштеди."},calc:{amount:3e4,months:12},faqs:[{q:"Дали да се поправа или да се продаде автомобилот?",a:"Споредете ја цената на поправката со вредноста на возилото и очекуваните идни трошоци."},{q:"Дали сервисите нудат плаќање на рати?",a:"Некои нудат. Прашајте директно пред да размислувате за позајмување."}],related:["neplanirani-trosoci","itni-domashni-trosoci","tekovni-trosoci"],articles:["kako-da-planirate-neplanirani-trosoci","na-shto-da-vnimavate-pred-kredit"]}),Ie({slug:"itni-domashni-trosoci",category:"neocekuvani-trosoci",kind:"usecase",navTitle:"Кредит за итни домашни трошоци",h1:"Итен трошок во домот?",metaTitle:"Кредит за итни трошоци во домот: опции | MoneyMax",metaDescription:"Расипан бојлер, протекување или фрижидер? Проценете дали е итно и како да ги споредите опциите.",primaryKeyword:"кредит за итни трошоци",seoNote:"Силно преклопување со /krediti/neplanirani-trosoci/. Размислете за консолидација.",icon:"zap",cardBlurb:"Расипан бојлер или протекување? Прво проценете, па одлучете.",intro:"Кога ќе се расипе бојлерот во зима или ќе протече цевка, не може да се чека. Но дури и во итни ситуации пет минути за преглед на опциите можат да ви заштедат пари: поправка или замена, различни понуди и можности за плаќање.",howItHelps:"За итни домашни трошоци најдобро е да имате резерва, а ако немате, пресметајте ја ратата на општ кредит. [Не е потврде
